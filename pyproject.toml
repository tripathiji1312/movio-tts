[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "movio-tts"
version = "0.2.0"
description = "Solution 4 — VITS + FastSpeech2 cascaded TTS for Tamil / English / Tanglish"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }

dependencies = [
    "numpy>=1.26,<2.0",
    "pyyaml>=6.0",
    "soundfile>=0.12",
    "librosa>=0.10",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "redis>=5.0",
    "httpx>=0.27",
    "psutil>=5.9",
    "torch>=2.2",
    "onnxruntime>=1.17",
    "onnx>=1.22.0",
    "onnxscript>=0.7.1",
]

[project.optional-dependencies]
vits = [
    "TTS>=0.22.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["movio*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
