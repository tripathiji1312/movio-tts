[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "movio-tts"
version = "0.1.0"
description = "Solution 1 — IndicF5 Modular Polyglot TTS pipeline for Tamil / English / Tanglish"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
    "numpy>=1.26,<3.0",
    "pyyaml>=6.0",
    "soundfile>=0.12",
    "librosa>=0.10",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "redis>=5.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.2",
    "transformers>=4.44",
    "accelerate>=0.33",
    "vocos>=0.1.0",
    "onnxruntime-gpu>=1.18",
]
cpu-dev = [
    "torch>=2.2",
    "transformers>=4.44",
    "accelerate>=0.33",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["movio*"]

[tool.ruff]
line-length = 100
target-version = "py310"
