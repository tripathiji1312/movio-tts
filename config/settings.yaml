# movio TTS — CPU-first live streaming (IndicF5, 24 kHz)
# Architecture: Stage A → B → IndicF5Engine (chunked streaming, 12xEuler)
# Active runtime is IndicF5Engine (movio/pipeline.py:101); hybrid/MMS
# modules are retained but unwired. Disk phrase cache (~5ms) is a
# future optimisation, not on the current hot path.
#
# Live-stream profile (CPU-first, GPU-ready by flipping device to "cuda"):
#   device cpu, num_flow_steps 12, ode euler, sway -1.0, cfg 2.0.
#   24xMidpoint is ~4x slower — keep 24xEuler for offline phrase_cache only.
#   ode_method is bound at load (indicf5_engine.py:145-154) — restart after edit.
#
# One-time setup:
#   python -m movio.acoustic.phrase_cache --config config/settings.yaml
# This pre-synthesises ~200 common taxi phrases using IndicF5 (if available)
# or MMS-TTS, and writes PCM16 files to models/phrase_cache/.

server:
  host: "0.0.0.0"
  port: 8000
  ws_chunk_ms: 50
  sample_rate: 24000        # IndicF5 native rate (24 kHz, single truth = engine.SAMPLE_RATE)
  opus_bitrate_kbps: 24     # lower bandwidth placeholder (no Opus route yet)

stage_a:
  text_normalization:
    use_wfst: true
    wfst_language: "ta"
    nemo_fallback: true
    domain_rules: true
    gazetteer_path: "config/gazetteer/proper_nouns.txt"

stage_b:
  router:
    lid_backend: "auto"
    xlit_backend: "none"
    lid_target_langs: ["ta", "en", "ta_roman"]
    insert_cs_tokens: true
    cs_token: "<cs>"
    keep_proper_nouns_latin: true
    gazetteer_path: "config/gazetteer/proper_nouns.txt"
    max_xlit_word_len: 24

stage_c:
  hybrid:
    # Pre-synthesised phrase cache (built by phrase_cache.py).
    # ~200 phrases × ~32 KB each = ~6 MB on disk.
    cache_dir: "models/phrase_cache"
    default_voice: "ta_female_neutral"

  mms:
    # Facebook MMS-TTS Tamil — real-time fallback for uncached phrases.
    # ~80 MB download, Apache 2.0, ~50-150 ms on a single CPU core.
    model_id: "facebook/mms-tts-tam"

  indicf5:
    # LIVE runtime profile (CPU-first). indicf5_engine defaults are
    # 12/euler/-1.0/2.0; YAML wins — keep 12/euler for serving.
    # Set model_path to your exported fine-tuned bundle after training, or
    # leave "base" to use ai4bharat/IndicF5.
    # NOTE: ode_method binds at load — restart the server after any change.
    model_path: "base"
    device: "cpu"
    num_flow_steps: 16
    sway_sampling_coef: -1.0
    cfg_strength: 2.0
    ode_method: "euler"
    speed: 0.95
    voices_dir: "config/voices"
    default_voice: "ta_female_neutral"

cache:
  backend: "memory"
  redis_url: "redis://localhost:6379/0"
  ttl_seconds: 604800       # 7 days — phrases don't change
  max_audio_bytes_mb: 8

pipeline:
  enable_cache: true
  stage_timeout_ms:
    stage_a: 50
    stage_b: 50
    stage_c: 500             # hard deadline — MMS-TTS is well under this
