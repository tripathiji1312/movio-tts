# movio TTS — CPU-optimised hybrid serving
# Architecture: disk cache (~5ms) + MMS-TTS fallback (~100ms) → p99 ≤500ms on CPU
#
# Stage A → text normalisation
# Stage B → Tanglish router
# Stage C → HybridEngine (disk phrase cache first, MMS-TTS on miss)
#
# One-time setup:
#   python -m movio.acoustic.phrase_cache --config config/settings.yaml
# This pre-synthesises ~200 common taxi phrases using IndicF5 (if available)
# or MMS-TTS, and writes PCM16 files to models/phrase_cache/.

server:
  host: "0.0.0.0"
  port: 8000
  ws_chunk_ms: 50
  sample_rate: 16000        # MMS-TTS native rate (16 kHz)
  opus_bitrate_kbps: 24     # lower bandwidth at 16 kHz

stage_a:
  text_normalization:
    use_wfst: true
    wfst_language: "ta"
    nemo_fallback: true
    domain_rules: true
    gazetteer_path: "config/gazetteer/proper_nouns.txt"

stage_b:
  router:
    lid_backend: "auto"
    xlit_backend: "auto"
    lid_target_langs: ["ta", "en", "ta_roman"]
    insert_cs_tokens: true
    cs_token: "<cs>"
    keep_proper_nouns_latin: true
    gazetteer_path: "config/gazetteer/proper_nouns.txt"
    max_xlit_word_len: 24

stage_c:
  hybrid:
    # Pre-synthesised phrase cache (built by phrase_cache.py).
    # ~200 phrases × ~32 KB each = ~6 MB on disk.
    cache_dir: "models/phrase_cache"
    default_voice: "default"

  mms:
    # Facebook MMS-TTS Tamil — real-time fallback for uncached phrases.
    # ~80 MB download, Apache 2.0, ~50-150 ms on a single CPU core.
    model_id: "facebook/mms-tts-tam"

  indicf5:
    # Used ONLY by phrase_cache.py (offline pre-synthesis), NOT at runtime.
    # Set model_path to your exported fine-tuned bundle after training, or
    # leave "base" to use ai4bharat/IndicF5 for pre-cache synthesis.
    model_path: "models/indicf5_tanglish_v2"
    device: "cpu"
    num_flow_steps: 24
    sway_sampling_coef: -1.0
    cfg_strength: 2.5
    speed: 1.0
    voices_dir: "config/voices"
    default_voice: ""

cache:
  backend: "memory"
  redis_url: "redis://localhost:6379/0"
  ttl_seconds: 604800       # 7 days — phrases don't change
  max_audio_bytes_mb: 8

pipeline:
  enable_cache: true
  stage_timeout_ms:
    stage_a: 50
    stage_b: 50
    stage_c: 500             # hard deadline — MMS-TTS is well under this
