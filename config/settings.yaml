# Solution 4 — VITS + FastSpeech2 Cascaded Stack
# Pre-trained checkpoints, no training required for v1.
# All paths relative to repo root unless absolute.

server:
  host: "0.0.0.0"
  port: 8000
  ws_chunk_ms: 50          # streaming chunk size in milliseconds
  sample_rate: 22050       # VITS native output rate
  opus_bitrate_kbps: 48

stage_a:
  text_normalization:
    use_wfst: true              # indic-text-normalization (Pynini) if installed
    wfst_language: "ta"
    nemo_fallback: true         # nemo_text_processing WFST fallback if installed
    domain_rules: true          # built-in OTP / phone / time / vehicle / currency rules
    gazetteer_path: "config/gazetteer/proper_nouns.txt"

stage_b:
  router:
    lid_backend: "auto"         # auto | indiclid | heuristic
    xlit_backend: "auto"        # auto | indicxlit | none
    lid_target_langs: ["ta", "en", "ta_roman"]
    insert_cs_tokens: true
    cs_token: "<cs>"
    keep_proper_nouns_latin: true
    gazetteer_path: "config/gazetteer/proper_nouns.txt"
    max_xlit_word_len: 24

stage_c:
  # Cascaded engine: VITS T1 (hot) → FastSpeech2 T2 (fallback)
  enable_fallback: true
  vits_timeout_ms: 5000

  vits:
    # samprabin/tamil_vits — MIT license, ~80M params
    model_path: "models/vits/tamil_vits/model.pth"
    config_path: "models/vits/tamil_vits/config.json"
    onnx_path: "models/vits/tamil_vits/model.onnx"
    use_onnx: true              # ONNX FP32: ~450ms/sentence on 4-core CPU
    device: "cpu"               # cpu | cuda
    speaker_id: null
    length_scale: 0.95          # slightly faster = more natural pacing
    noise_scale: 0.667          # controls expressiveness vs stability
    noise_scale_w: 0.8          # duration predictor noise
    sample_rate: 22050

  fastspeech2:
    # smtiitm/FastSpeech2_HS — IIT Madras, MIT license, ~15M + 14M params
    model_path: "models/fastspeech2/tamil_fs2/model.pth"
    config_path: "models/fastspeech2/tamil_fs2/config.json"
    vocoder_path: "models/fastspeech2/hifigan/model.pth"
    vocoder_config_path: "models/fastspeech2/hifigan/config.json"
    onnx_path: "models/fastspeech2/tamil_fs2/model.onnx"
    vocoder_onnx_path: "models/fastspeech2/hifigan/vocoder.onnx"
    use_onnx: false
    device: "cpu"
    sample_rate: 22050

cache:
  backend: "memory"             # memory | redis (use redis in production)
  redis_url: "redis://localhost:6379/0"
  ttl_seconds: 604800           # 7 days
  max_audio_bytes_mb: 8

pipeline:
  enable_cache: true
  stage_timeout_ms:
    stage_a: 200
    stage_b: 150
    stage_c: 5000
