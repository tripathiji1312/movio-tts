# movio TTS — IndicF5 (F5-TTS CFM-DiT, 337M params, 24 kHz)
# Stage A → text normalization → Stage B → Tanglish router → Stage C → IndicF5 acoustic

server:
  host: "0.0.0.0"
  port: 8000
  ws_chunk_ms: 50          # streaming chunk size in milliseconds
  sample_rate: 24000       # IndicF5 native output rate
  opus_bitrate_kbps: 48

stage_a:
  text_normalization:
    use_wfst: true              # indic-text-normalization (Pynini) if installed
    wfst_language: "ta"
    nemo_fallback: true         # nemo_text_processing fallback if installed
    domain_rules: true          # built-in OTP / phone / time / vehicle / currency rules
    gazetteer_path: "config/gazetteer/proper_nouns.txt"

stage_b:
  router:
    lid_backend: "auto"         # auto | indiclid | heuristic
    xlit_backend: "auto"        # auto | indicxlit | none
    lid_target_langs: ["ta", "en", "ta_roman"]
    insert_cs_tokens: true
    cs_token: "<cs>"
    keep_proper_nouns_latin: true
    gazetteer_path: "config/gazetteer/proper_nouns.txt"
    max_xlit_word_len: 24

stage_c:
  indicf5:
    # "base" → downloads ai4bharat/IndicF5 weights from HF Hub (MIT, Tamil-aware)
    # "/path/to/bundle" → fine-tuned bundle dir (model.pt + vocab.txt)
    model_path: "base"

    # Path to cloned SWivid/F5-TTS repo; leave empty if installed via pip
    f5tts_dir: ""

    device: "cuda"              # cuda | cpu

    # Flow steps: quality vs latency trade-off
    #   8  → ~150-250ms/chunk on T4 (lower quality)
    #   12 → ~250-400ms/chunk on T4 (good quality)   ← default
    #   20 → ~500-700ms/chunk on T4 (best quality)
    num_flow_steps: 12

    sway_sampling_coef: -1.0    # negative = sway sampling on (recommended)
    cfg_strength: 2.0           # classifier-free guidance strength
    speed: 1.0                  # 1.0 = natural pace; <1.0 = slower, >1.0 = faster

    # Voice profiles directory — each subdir has voice.yaml (ref_audio + ref_text)
    voices_dir: "config/voices"
    default_voice: ""           # empty = use first available voice

cache:
  backend: "memory"             # memory | redis (use redis in production)
  redis_url: "redis://localhost:6379/0"
  ttl_seconds: 604800           # 7 days
  max_audio_bytes_mb: 8

pipeline:
  enable_cache: true
  stage_timeout_ms:
    stage_a: 200
    stage_b: 150
    stage_c: 10000              # IndicF5 is slower than VITS; 10s covers long sentences
